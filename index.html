<!doctype html><html><head><meta charset="utf-8"><title>TECH-317 QA Dashboard</title>
<style>
body{margin:0;background:#0d1117;color:#c9d1d9;font:14px system-ui,sans-serif}
nav{position:sticky;top:0;background:#161b22;border-bottom:1px solid #30363d;display:flex;gap:4px;padding:8px 16px;z-index:9;flex-wrap:wrap}
nav a{color:#c9d1d9;text-decoration:none;padding:6px 12px;border-radius:6px}nav a.on,nav a:hover{background:#30363d;color:#fff}
main{padding:16px 24px;max-width:1500px}h1{font-size:20px}h3{margin:14px 0 6px}
.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;min-width:230px;cursor:pointer}
.card:hover{border-color:#58a6ff}
table{width:100%;border-collapse:collapse}th{text-align:left;color:#8b949e;font-weight:500;border-bottom:1px solid #30363d;padding:6px}
tr.row td{padding:7px 6px;border-bottom:1px solid #21262d;cursor:pointer}tr.row:hover td{background:#1c2330}tr.row.open td{background:#1f2a3a}
.v{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;margin:1px}
.PASS{background:#1f6f3a;color:#fff}.MISMATCH{background:#8e1f1f;color:#fff}.BOTH-BUG{background:#a3005c;color:#fff}.BLOCKED{background:#5a4a12;color:#fff}
.PARTIAL{background:#8a5a00;color:#fff}.EXPECTED-DIFF{background:#1f4d8e;color:#fff}.SKIPPED,.INVALID{background:#444;color:#fff}
.det td{background:#0b0f15;padding:12px 16px;border-bottom:2px solid #30363d}
.probe{border:1px solid #30363d;border-radius:8px;margin:10px 0;padding:10px}.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:#161b22;border-radius:6px;padding:8px;min-width:0}pre{white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;background:#010409;padding:8px;border-radius:4px;font-size:12px;margin:4px 0}
.k{color:#8b949e}input{background:#010409;color:#c9d1d9;border:1px solid #30363d;padding:6px;border-radius:6px;width:300px}
</style></head><body><nav id="nav"></nav><main id="main"></main>
<script src="data/data.js"></script><script>
const Q=window.QA,M=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const vb=v=>`<span class="v ${esc(v)}">${esc(v)}</span>`;
const pj=o=>o==null?'<span class="k">null</span>':`<pre>${esc(typeof o=='string'?o:JSON.stringify(o,null,2))}</pre>`;
const verd=c=>(c.result||{}).verdict||'?';
const all=()=>Q.sections.flatMap(s=>s.cases.map(c=>[s,c]));
function counts(cs){const m={};cs.forEach(c=>m[verd(c)]=(m[verd(c)]||0)+1);const O=['PASS','EXPECTED-DIFF','PARTIAL','MISMATCH','BOTH-BUG','OLD-BUG','NEW-BUG','INVALID','BLOCKED','SKIPPED'];const r=k=>{const i=O.indexOf(k);return i<0?99:i};return Object.keys(m).sort((a,b)=>r(a)-r(b)||a.localeCompare(b)).filter(k=>m[k]>0).map(k=>vb(k+' '+m[k])).join(' ')}
function nav(cur){document.getElementById('nav').innerHTML=[['hub','Hub'],...Q.sections.map(s=>[s.key,s.title]),['both','Both-system bugs']].map(([k,t])=>`<a href="#${k}" class="${k==cur?'on':''}">${t}</a>`).join('')}
function side(x){if(!x)return '<span class="k">not run</span>';const rq=x.request||{},rs=x.response||{};
return `<div><b>${esc(rq.method)}</b> ${esc(rq.url)} <span class="k">${esc(x.call_id)} · ${esc(x.duration_ms)}ms</span></div>
<div class="k">request headers</div>${pj(rq.headers)}<div class="k">request body</div>${pj(rq.body)}
<div>status <b>${esc(rs.status)}</b> <span class="k">(${esc(rs.body_kind)})</span></div><div class="k">response headers</div>${pj(rs.headers)}<div class="k">response body</div>${pj(rs.body)}
${Object.keys(x).filter(k=>!['request','response','call_id','duration_ms','side','started_at'].includes(k)).map(k=>`<div class="k">${esc(k)}</div>${pj(x[k])}`).join('')}`}
function detail(c){const r=c.result||{};
let h=`<div><b>${esc(c.id)} — ${esc(c.name)}</b> ${vb(verd(c))}</div><p><span class="k">Intent:</span> ${esc(c.intent)}</p>
<p><span class="k">Expected:</span> ${esc((c.expected||{}).statement)} <span class="k">(${esc((c.expected||{}).source)})</span></p>
<p><span class="k">Verdict reason:</span> ${esc(r.verdict_reason)}</p>${r.override?'<div class="k">override</div>'+pj(r.override):''}
<details><summary>Result / coverage / compare rules / annotations</summary>${pj({result:r,compare_rules:c.compare_rules,annotations:c.annotations,fixtures:c.fixtures,credential_roles:c.credential_roles})}</details>
<h3>Setup (${(c.setup||[]).length})</h3>${(c.setup||[]).length?pj(c.setup):'<span class="k">none</span>'}<h3>Probes (${(c.probes||[]).length})</h3>`;
(c.probes||[]).forEach(p=>{h+=`<div class="probe"><div><b>${esc(p.probe_id)}</b> ${esc(p.intent)} ${vb(p.verdict||p.status)} <span class="k">status=${esc(p.status)}</span></div>
<div class="k">expected: ${esc((p.expected||{}).statement)}</div>${p.not_run?'<div class="k">not_run</div>'+pj(p.not_run):''}
${p.diff?'<div class="k">diff ('+esc(p.diff.count)+')</div>'+pj(p.diff.entries):''}${p.expectation_check?'<div class="k">expectation check</div>'+pj(p.expectation_check):''}
${p.section_extras&&Object.keys(p.section_extras).length?'<div class="k">extras</div>'+pj(p.section_extras):''}
<div class="sides"><div class="side"><b>OLD</b> ${side(p.old)}</div><div class="side"><b>NEW</b> ${side(p.new)}</div></div></div>`});
h+=`<h3>Teardown</h3>${pj(c.teardown)}<div class="k">source: ${esc(c._file)}</div>`;return h}
function table(rows,showSec){window._rows=rows;return `<input id="f" placeholder="filter id / name / verdict" oninput="filt(this.value)"><table><thead><tr>${showSec?'<th>Section</th>':''}<th>ID</th><th>Name</th><th>Verdict</th><th>Probes</th><th>Reason</th></tr></thead><tbody>`+
rows.map(([s,c],i)=>`<tr class="row" data-i="${i}" data-t="${esc((c.id+' '+c.name+' '+verd(c)).toLowerCase())}" onclick="tog(this)">${showSec?`<td>${esc(s.title)}</td>`:''}<td><b>${esc(c.id)}</b></td><td>${esc(c.name)}</td><td>${vb(verd(c))}</td><td>${(c.probes||[]).length}</td><td class="k">${esc(((c.result||{}).verdict_reason||'').slice(0,140))}</td></tr>`).join('')+'</tbody></table>'}
function tog(tr){const n=tr.nextElementSibling;if(n&&n.classList.contains('det')){n.remove();tr.classList.remove('open');return}
const [s,c]=window._rows[tr.dataset.i];const d=document.createElement('tr');d.className='det';d.innerHTML=`<td colspan="9">${detail(c)}</td>`;tr.after(d);tr.classList.add('open');
const id=location.hash.split('/')[0];history.replaceState(null,'',id+'/'+c.id)}
function filt(v){v=v.toLowerCase();document.querySelectorAll('tr.row').forEach(r=>{const h=!r.dataset.t.includes(v);r.style.display=h?'none':'';const n=r.nextElementSibling;if(n&&n.classList.contains('det'))n.style.display=h?'none':''})}
function route(){const [k,open]=(location.hash.slice(1)||'hub').split('/');nav(k);
if(k=='hub'){const O=['PASS','EXPECTED-DIFF','PARTIAL','MISMATCH','BOTH-BUG','OLD-BUG','NEW-BUG','INVALID','BLOCKED','SKIPPED'];const secs=Q.sections.map(s=>[s.key,s.title,s.cases]).concat([['both','Both-system bugs',all().filter(([s,c])=>verd(c)=='BOTH-BUG').map(x=>x[1])]]);const used=O.filter(v=>secs.some(x=>x[2].some(c=>verd(c)==v)));
M.innerHTML=`<h1>TECH-317 QA — Round 2</h1><table class="hub"><thead><tr><th>Section</th><th>Total</th>${used.map(v=>`<th>${vb(v)}</th>`).join('')}</tr></thead><tbody>`+secs.map(([key,title,cs])=>`<tr class="hubrow" style="cursor:pointer" onclick="location.hash='${key}'"><td><a href="#${key}"><b>${title}</b></a></td><td>${cs.length}</td>${used.map(v=>{const n=cs.filter(c=>verd(c)==v).length;return `<td style="text-align:center">${n||'·'}</td>`}).join('')}</tr>`).join('')+`</tbody></table><style>tr.hubrow:hover{background:rgba(127,127,127,.15)}</style><p class="k">Click a section row, then click any test row to expand the full captured report.</p>`;return}
let rows,t;if(k=='both'){rows=all().filter(([s,c])=>verd(c)=='BOTH-BUG');t='Both-system bugs (verdict BOTH-BUG)'}else{const s=Q.sections.find(x=>x.key==k);if(!s){M.innerHTML='unknown';return}rows=s.cases.map(c=>[s,c]);t=s.title+' — '+s.cases.length+' cases '+counts(s.cases)}
M.innerHTML=`<h1>${t}</h1>`+(rows.length?table(rows,k=='both'):'<p>None.</p>');
if(open){const tr=[...document.querySelectorAll('tr.row')].find(r=>window._rows[r.dataset.i][1].id==open);if(tr){tog(tr);tr.scrollIntoView()}}}
window.onhashchange=route;route();
</script></body></html>

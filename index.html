<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

th{text-align:left;font-size:13px;font-weight:600;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f8f7f5}
.num{text-align:right;font-variant-numeric:tabular-nums;width:84px}.zero{color:#d6d3d1}
.b{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
.v-BOTH-BUG,.v-MISMATCH{color:var(--red);background:var(--redbg)}.v-INVALID,.v-PARTIAL{color:var(--amb);background:var(--ambbg)}
.v-BLOCKED,.v-SKIPPED{color:var(--gry);background:var(--grybg)}.v-EXPECTED-DIFF{color:var(--blu);background:var(--blubg)}.v-PASS{color:var(--grn);background:var(--grnbg)}
.legend{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-size:15px}

</style></head><body><div class="wrap">
<h1>TECH-317 — OLD API vs NEW API</h1>
<p class="sub">Batch 1, round 2. Every test sends the same request to OLD (Laravel) and NEW (staging5) and compares the answers. 144 tests.</p>
<nav id="nav"></nav><main id="main"></main></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box" id="mbox"></div></div>
<script src="data/summary.js"></script>
<script>
const ORDER=['BOTH-BUG','MISMATCH','INVALID','PARTIAL','BLOCKED','SKIPPED','EXPECTED-DIFF','PASS'];
const LBL={'BOTH-BUG':'Bug in both','MISMATCH':'Different','INVALID':'Test broken','PARTIAL':'Incomplete','BLOCKED':'Couldn’t run','SKIPPED':'Skipped','EXPECTED-DIFF':'Intended change','PASS':'Same'};
const DEF={'PASS':'OLD and NEW gave the same answer, and it’s the correct one.',
'EXPECTED-DIFF':'OLD and NEW differ, but the difference is a deliberate, documented change.',
'MISMATCH':'OLD and NEW gave different answers and nobody has explained why. Needs a look.',
'BOTH-BUG':'OLD and NEW agree — but both are wrong compared to the spec.',
'PARTIAL':'Only some of the planned checks ran. Not a pass — the rest is unverified.',
'BLOCKED':'Nothing could run (e.g. no SMS code, missing setup data).',
'SKIPPED':'Deliberately not run this round.',
'INVALID':'The test harness itself failed — result says nothing about the API.'};
const S=window.SUM; const SECS=S.map(s=>({key:s.key,title:s.title,cases:s.cases}));
const both=[];S.forEach(s=>s.cases.forEach(c=>{if(c.verdict==='BOTH-BUG')both.push({...c,_sec:s.key})}));
SECS.push({key:'both',title:'Bugs in both',cases:both});
const esc=t=>String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const badge=v=>`<span class="b v-${v}">${LBL[v]||v}</span>`;
const findC=(k,id)=>{const s=SECS.find(x=>x.key===k);return s&&s.cases.find(c=>c.id===id)};
const BK={look:['Needs a look','Status differs, a field type differs, NEW is missing a field, or the spec check failed. These are the real candidates.'],
noise:['Different DB values only','Only values differ (ids, timestamps, lat/lng, addresses, debug trace on 500s). Same shape. Not a NEW bug.'],
extra:['NEW adds fields only','Same types, nothing missing — NEW just returns extra fields (e.g. hubspot_*). Additive, low risk.'],
ok:['Matched or intended','Same answer, or a documented intended change.'],
incomplete:['Incomplete / broken test','Only part ran, or the harness itself failed. Says nothing yet.'],
norun:['Didn’t run','Blocked (no SMS code, missing setup) or skipped this round.']};
const BKO=['look','noise','extra','ok','incomplete','norun'];
let filt=null,bfilt=null;
function route(){const [k,id]=location.hash.slice(1).split('/');
 document.getElementById('nav').innerHTML=`<a href="#" class="${!k?'on':''}">Overview</a>`+SECS.map(s=>`<a href="#${s.key}" class="${k===s.key?'on':''}">${s.title} <span class="meta">${s.cases.length}</span></a>`).join('');
 if(!k)hub();else sec(k);
 if(id){const c=findC(k,id);c?openM(k,c):closeM(true)}else closeM(true)}
function hub(){const cols=ORDER;const all=S.flatMap(s=>s.cases.map(c=>({...c,_s:s.key})));const N={};all.forEach(c=>N[c.bucket]=(N[c.bucket]||0)+1);
 const mm=all.filter(c=>c.verdict==='MISMATCH'),mmReal=mm.filter(c=>c.bucket==='look').length;
 let h=`<div class="hero"><h2>NEW is not 80% broken. ${N.look||0} of ${all.length} tests need a real look.</h2>
 <div class="meta">The raw run flagged ${mm.length} tests “Different”. Re-read by <b>shape</b> (same status, same field types, no missing fields) instead of exact values: <b>${mmReal}</b> are real shape/status differences, <b>${mm.filter(c=>c.bucket==='noise').length}</b> differ only in DB values, <b>${mm.filter(c=>c.bucket==='extra').length}</b> only add fields on NEW. ${(N.norun||0)+(N.incomplete||0)} tests didn’t fully run.</div>
 <div class="note"><b>Why the raw report looked so bad:</b> round-2 verdicts compared response bodies value-by-value. OLD (local :8001) and NEW (staging5) use different databases, so ids, hubspot ids, addresses, lat/lng and timestamps always differ. The right check is shape: status matches, every field OLD returns is still there on NEW, with the same type. Buckets below use that rule on the existing diffs — the stored test verdicts were not changed.</div>
 <div class="bk">${BKO.map(b=>`<div class="${b}" onclick="bfilt='${b}';route()"><div class="n">${N[b]||0}</div><div class="t">${BK[b][0]}</div><div class="d">${BK[b][1]}</div></div>`).join('')}</div></div>
 ${bfilt?bucketList(all):''}
 <h2>Sections</h2><table><thead><tr><th>Section</th><th class="num">Tests</th>${BKO.map(b=>`<th class="num">${BK[b][0]}</th>`).join('')}</tr></thead><tbody>`;
 SECS.filter(s=>s.key!=='both').forEach(s=>{const n={};s.cases.forEach(c=>n[c.bucket]=(n[c.bucket]||0)+1);
  h+=`<tr class="click" onclick="location.hash='${s.key}'"><td class="tname">${s.title}</td><td class="num">${s.cases.length}</td>${BKO.map(b=>`<td class="num ${n[b]?'':'zero'}">${n[b]?(b==='look'?`<b style="color:var(--red)">${n[b]}</b>`:n[b]):'—'}</td>`).join('')}</tr>`});
 h+=`</tbody></table><h2>Raw round-2 verdicts (value diff)</h2><table><thead><tr><th>Section</th><th class="num">Tests</th>${cols.map(v=>`<th class="num">${LBL[v]}</th>`).join('')}</tr></thead><tbody>`;
 SECS.forEach(s=>{const n={};s.cases.forEach(c=>n[c.verdict]=(n[c.verdict]||0)+1);
  h+=`<tr class="click" onclick="location.hash='${s.key}'"><td class="tname">${s.title}</td><td class="num">${s.cases.length}</td>${cols.map(v=>`<td class="num ${n[v]?'':'zero'}">${n[v]||'—'}</td>`).join('')}</tr>`});
 h+=`</tbody></table><p class="meta">Sections in Batch 1 order. Click a row for its tests (worst first).</p>
 <h2>Raw verdict labels</h2><div class="legend">${ORDER.map(v=>`<div>${badge(v)}</div><div>${DEF[v]}</div>`).join('')}</div>`;
 document.getElementById('main').innerHTML=h}
function bucketList(all){const L=all.filter(c=>c.bucket===bfilt);return `<h2>${BK[bfilt][0]} (${L.length}) <button class="close" style="float:none;width:auto;padding:0 10px;font-size:13px" onclick="bfilt=null;route()">clear</button></h2><table><tbody>${L.map(c=>`<tr class="click" onclick="location.hash='${c._s}/${c.id}'"><td style="width:140px">${badge(c.verdict)}</td><td class="tid" style="width:80px">${c.id}</td><td><div class="tname">${esc(c.name)}</div><div class="why">${esc(c.shape.length?c.shape.slice(0,3).join(' · ')+(c.shape_n>3?` · +${c.shape_n-3} more`:''):c.why)}</div></td></tr>`).join('')}</tbody></table>`}
function hubOLD(){const cols=ORDER;
 let h=`<h2 style="margin-top:0">Sections</h2><table><thead><tr><th>Section</th><th class="num">Tests</th>${cols.map(v=>`<th class="num">${LBL[v]}</th>`).join('')}</tr></thead><tbody>`;
 SECS.forEach(s=>{const n={};s.cases.forEach(c=>n[c.verdict]=(n[c.verdict]||0)+1);
  h+=`<tr class="click" onclick="location.hash='${s.key}'"><td class="tname">${s.title}</td><td class="num">${s.cases.length}</td>${cols.map(v=>`<td class="num ${n[v]?'':'zero'}">${n[v]?`<b style="color:var(--${/BUG|MISM/.test(v)?'red':/INVAL|PART/.test(v)?'amb':v==='PASS'?'grn':v==='EXPECTED-DIFF'?'blu':'gry'})">${n[v]}</b>`:'—'}</td>`).join('')}</tr>`});
 h+=`</tbody></table><p class="meta">Sections are in Batch 1 order. Click a row to see its tests (worst first). Columns go from most to least serious.</p>
 <h2>What the labels mean</h2><div class="legend">${ORDER.map(v=>`<div>${badge(v)}</div><div>${DEF[v]}</div>`).join('')}</div>`;
 document.getElementById('main').innerHTML=h}
function sec(k){const s=SECS.find(x=>x.key===k);if(!s)return hub();
 const present=ORDER.filter(v=>s.cases.some(c=>c.verdict===v));
 let h=`<div class="filters"><button class="${!filt?'on':''}" onclick="filt=null;route()">All ${s.cases.length}</button>${present.map(v=>`<button class="${filt===v?'on':''}" onclick="filt='${v}';route()">${LBL[v]} ${s.cases.filter(c=>c.verdict===v).length}</button>`).join('')}</div>
 <table><thead><tr><th style="width:150px">Result</th><th style="width:90px">Test</th><th>What it checks · why it got this result</th></tr></thead><tbody>`;
 s.cases.filter(c=>!filt||c.verdict===filt).forEach(c=>{h+=`<tr class="click" onclick="location.hash='${k}/${c.id}'"><td>${badge(c.verdict)}</td><td class="tid">${c.id}${c._sec?`<br><span class="meta">${c._sec}</span>`:''}</td><td><div class="tname">${esc(c.name)}</div><div class="why">${esc(c.why)}</div></td></tr>`});
 document.getElementById('main').innerHTML=h+'</tbody></table>'}
const W={met:['correct','good'],violated:['wrong','bad'],'n/a':['no spec — parity only','']};
function probeHtml(p){
 if(p.status!=='ran')return `<div class="probe"><div class="ph">${badge(p.verdict||'BLOCKED')}<b>${p.id}</b> ${esc(p.intent)}</div><div class="nr">Not run — ${esc(p.not_run_reason||p.status)}</div></div>`;
 const sd=p.old_status!==p.new_status, e=x=>{const w=W[x]||[x,''];return `<div class="exp ${w[1]}">vs. spec: ${w[0]}</div>`};
 let d='';if(p.diffs.length){d=`<table class="dt"><thead><tr><th>Field</th><th>OLD</th><th>NEW</th></tr></thead><tbody>${p.diffs.map(x=>`<tr><td>${esc(x.path.replace('$body.',''))}${x.cls&&x.cls!=='unexplained'?` <span class="meta">(${esc(x.cls)})</span>`:''}</td><td class="o">${x.kind==='added'?'<i>missing</i>':esc(x.old)}</td><td class="n">${x.kind==='removed'?'<i>missing</i>':esc(x.new)}</td></tr>`).join('')}</tbody></table>${p.diff_count>p.diffs.length?`<div class="nr">+${p.diff_count-p.diffs.length} more differing fields (see full capture)</div>`:''}`}
 return `<div class="probe"><div class="ph">${badge(p.verdict)}<b>${p.id}</b> ${esc(p.intent)}</div>
 <div class="cmp"><div><div class="side">OLD</div><div class="code ${sd?'diff':''}">${p.old_status??'—'}</div>${e(p.exp_old)}</div><div><div class="side">NEW</div><div class="code ${sd?'diff':''}">${p.new_status??'—'}</div>${e(p.exp_new)}</div></div>${d}</div>`}
const BKWHY={look:'Real difference by shape rules (status, field type, or missing field) — see the list below.',noise:'Only values differ between the two databases. Same status, same fields, same types. Not a NEW bug.',extra:'NEW returns the same fields with the same types, plus a few extra fields. Nothing OLD clients need is missing.',ok:'',incomplete:'',norun:''};
const pj=x=>esc(JSON.stringify(x,null,2));
function sideHtml(nm,sd,hl){if(!sd)return `<div><div class="side">${nm}</div><div class="meta">no call</div></div>`;const q=sd.request||{},r=sd.response||{};
 let body=pj(r.body??r.body_ref??null);hl.forEach(k=>{body=body.split('&quot;'+esc(k)+'&quot;').join('<span class="hl">&quot;'+esc(k)+'&quot;</span>')});
 return `<div><div class="side">${nm}</div><div class="call"><b>${esc(q.method)}</b> ${esc(q.url)}</div>
 <div class="lbl">Request body</div><pre>${q.body==null?'(none)':pj(q.body)}</pre>
 <div class="lbl">Response</div><div class="code">${sd.transport_error?'ERR':r.status??'—'}</div><pre>${body}</pre>${r.truncated?'<div class="meta">body truncated in capture</div>':''}</div>`}
function claimsHtml(x){if(!x||!x.jwt_claims)return '';const o=x.jwt_claims.old||{},n=x.jwt_claims.new||{};const op=o.payload||{},np=n.payload||{};
 const ks=[...new Set([...Object.keys(op),...Object.keys(np)])];const ty=v=>v===undefined?'missing':v===null?'null':typeof v;
 return `<div class="lbl" style="padding:0 16px">Decoded token claims (raw body only shows a redacted token)</div><table class="dt"><thead><tr><th>Claim</th><th>OLD</th><th>NEW</th><th>Shape</th></tr></thead><tbody>${ks.map(k=>{const t1=ty(op[k]),t2=ty(np[k]);const bad=t1!==t2;
 return `<tr><td>${esc(k)}</td><td class="o">${esc(JSON.stringify(op[k]))} <span class="meta">${t1}</span></td><td class="n">${esc(JSON.stringify(np[k]))} <span class="meta">${t2}</span></td><td>${bad?`<b style="color:var(--red)">type differs</b>`:'<span class="meta">same type</span>'}</td></tr>`}).join('')}</tbody></table>`}
function diffKind(e){const p=e.path.split(' ').pop();if(p==='$status')return['Status differs','r'];if(e.kind==='changed')return['Value only (DB data)','m'];
 if(e.kind==='type'&&(e.old==null||e.new==null))return['Null on one side (data)','m'];if(e.kind==='type')return['Type differs','r'];if(e.kind==='added')return['Extra on NEW','m'];if(e.kind==='removed')return[/\.(exception|file|line|trace)$/.test(p)?'Debug trace (env)':'Missing on NEW',/\.(exception|file|line|trace)$/.test(p)?'m':'r'];return[e.kind,'m']}
function fullProbe(p,meta){const ents=(p.diff&&p.diff.entries)||[];
 if(p.status!=='ran')return `<div class="probe"><div class="ph">${badge(p.verdict||'BLOCKED')}<b>${p.probe_id}</b> ${esc(p.intent)}</div><div class="nr">Not run — ${esc((p.not_run&&(p.not_run.reason||p.not_run.reason_code))||p.status)}</div></div>`;
 const real=ents.filter(e=>diffKind(e)[1]==='r'),hl=real.map(e=>e.path.split(' ').pop().split('.').pop().replace(/\[\d+\]$/,''));
 const ec=p.expectation_check||{};const spec=(ec.old&&ec.old!=='met'&&ec.old!=='n/a')||(ec.new&&ec.new!=='met'&&ec.new!=='n/a');
 let plain=real.length?`<b>${real.length} real shape difference${real.length>1?'s':''}</b>: ${real.slice(0,4).map(e=>`<code>${esc(e.path.split(' ').pop().replace('$body.',''))}</code> ${diffKind(e)[0].toLowerCase()}${e.kind==='type'?` (OLD ${esc(JSON.stringify(e.old))} vs NEW ${esc(JSON.stringify(e.new))})`:''}`).join('; ')}${real.length>4?'…':''}.`:ents.length?`Only values/extra fields differ (${ents.length}) — same shape. Env noise.`:'';
 if(spec)plain+=` Spec check: OLD ${esc(ec.old)}, NEW ${esc(ec.new)}${ec.evidence?` — ${esc(ec.evidence)}`:''}.`;
 return `<div class="probe"><div class="ph">${badge(p.verdict)}<b>${p.probe_id}</b> ${esc(p.intent)}</div>
 ${plain?`<div class="nr">${plain}</div>`:''}
 <div class="cmp">${sideHtml('OLD',p.old,hl)}${sideHtml('NEW',p.new,hl)}</div>${claimsHtml(p.section_extras)}
 ${ents.length?`<table class="dt"><thead><tr><th>Field</th><th>OLD</th><th>NEW</th><th>What it is</th></tr></thead><tbody>${ents.slice(0,40).map(e=>{const [t,c]=diffKind(e);return `<tr><td>${esc(e.path.split(' ').pop().replace('$body.',''))}</td><td class="o">${e.kind==='added'?'<i>missing</i>':esc(JSON.stringify(e.old))}</td><td class="n">${e.kind==='removed'?'<i>missing</i>':esc(JSON.stringify(e.new))}</td><td>${c==='r'?`<b style="color:var(--red)">${t}</b>`:`<span class="meta">${t}</span>`}</td></tr>`}).join('')}</tbody></table>${ents.length>40?`<div class="nr">+${ents.length-40} more (see raw capture)</div>`:''}`:''}</div>`}
function openM(k,c){const v=c.verdict;const cls=c.bucket==='look'?'':c.bucket==='noise'||c.bucket==='extra'||c.bucket==='ok'?'ok':'warn';
 const B=BK[c.bucket]||['',''];
 document.getElementById('mbox').innerHTML=`<button class="close" onclick="location.hash='${k}'">×</button>${badge(v)} <span class="tid">${c.id}</span>
 <h3>${esc(c.name)}</h3><div class="meta">${esc(c.intent)}</div>

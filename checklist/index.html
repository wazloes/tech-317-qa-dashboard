<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TECH-317 checklist</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--soft:#f5f5f4;
--grn:#15803d;--grnbg:#f0fdf4;--amb:#b45309;--ambbg:#fffbeb;--red:#b91c1c;--redbg:#fef2f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:40px 28px 80px}
h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:36px 0 12px}
.sub{color:var(--mute);margin:0 0 24px}
.banner{background:var(--grnbg);border:1px solid #bbf7d0;border-radius:10px;padding:14px 18px;margin:0 0 28px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:13px;font-weight:600;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f8f7f5}
.ok{color:var(--grn);font-weight:600}.wait{color:var(--amb);font-weight:600}.todo{color:var(--mute)}.fail{color:var(--red);font-weight:600}.skip{color:var(--mute);font-weight:600}
.meta{color:var(--mute);font-size:14px}.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.modal{position:fixed;inset:0;background:rgba(28,25,23,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:9}
.modal.open{display:flex}.box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.box h3{font-size:22px;margin:8px 0 4px}.close{float:right;border:0;background:var(--soft);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.desc{font-size:16px;margin:12px 0 20px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:640px){.sides{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--soft)}
.side h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.side .code{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.side .code.ok{color:var(--grn)}.side .code.bad{color:var(--red)}
.side pre,.req pre{background:#1c1917;color:#e7e5e4;padding:12px;border-radius:8px;font-size:13px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.req{margin:16px 0}.label{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.badge.pass{color:var(--grn);background:var(--grnbg)}.badge.fail{color:var(--red);background:var(--redbg)}.badge.wait{color:var(--amb);background:var(--ambbg)}.badge.todo{color:var(--mute);background:var(--soft)}.badge.skip{color:#57534e;background:#f5f5f4}
.sec-empty{color:var(--mute);padding:8px 0}
a{color:#1d4ed8}
</style>
</head>
<body>
<div class="wrap">
<h1>TECH-317 checklist</h1>
<p class="sub">Linear story on staging5 — one box at a time. Click a row for what was sent, what came back, and OLD (local) vs NEW (staging5). Source: <a href="https://linear.app/faberconnect/issue/TECH-317/qa-waz-payments-hourstimecards-invoicing-pdfs-authotpjwt-on-staging5">TECH-317</a>.</p>

<div class="banner" id="banner"></div>
<div id="main"></div>
<p class="meta" style="margin-top:40px">HTML · personal GitHub Pages · not a Grok Page.</p>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="box" id="mbox"></div>
</div>

<script>
const TESTS = [
  {
    id: 'P1',
    section: 'pre',
    name: 'Health check `/up`',
    status: 'pass',
    linear: 'P1 · GET staging5 /up returns 200',
    simple: 'Hit the health URL on both servers. NEW must return 200. OLD (Laravel 5.7) has no `/up` route, so 404 there is expected.',
    sent: {
      method: 'GET',
      path: '/up',
      body: null,
      note: 'No body. No auth.'
    },
    old: {
      label: 'OLD · local :8001',
      url: 'http://127.0.0.1:8001/up',
      status: 404,
      body: 'HTML 404 page (route does not exist on master)',
      ok: false,
      note: 'Expected — `/up` was added for L13 / staging5.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com/up',
      status: 200,
      body: 'OK',
      ok: true,
      note: 'Passes the Linear checkbox.'
    },
    time: '2026-10-29 11:33 MST (rechecked 11:40 MST)',
    verdict: 'Linear P1 = Pass (NEW 200). OLD 404 is not a fail for this box.'
  },
  {
    id: 'P2',
    section: 'pre',
    name: 'Not on prod DB (jordan+1 marker)',
    status: 'pass',
    linear: 'P2 · local + staging5 not on prod (test-DB marker)',
    simple: 'If jordan+1@faberconnect.com exists, that DB is the shared test/staging DB. Confirm local is isolated and staging5 is on test (not prod).',
    sent: {
      method: 'POST',
      url: '/auth/admin',
      body: '{ email: jordan+1@faberconnect.com, password: •••• }'
    },
    old: {
      label: 'OLD · local',
      url: 'http://127.0.0.1:8001/auth/admin (+ DB faber_local)',
      status: 401,
      body: 'You have provided invalid credentials. / users table: 0 rows for jordan+1',
      ok: true,
      note: 'Local faber_local — not the test DB (and not prod).'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com/auth/admin',
      status: 200,
      body: '{ "token": "<JWT>" }',
      ok: true,
      note: 'jordan+1 exists → staging5 is on the shared test/staging DB (not prod).'
    },
    time: '2026-10-29 11:45 MST',
    verdict: 'Pass — local isolated; staging5 on test DB as expected.'
  },
  {
    id: 'P3',
    section: 'pre',
    name: 'Stripe test keys',
    status: 'pass',
    linear: 'P3 · Stripe sk_test_ / pk_test_',
    simple: 'Confirm Stripe secret starts with sk_test_ and the FE uses pk_test_.',
    sent: {
      method: 'env check + API',
      url: 'local .env STRIPE_SECRET / STRIPE_USA_SECRET; staging5 POST /v2/admin/company/credit-card/stripe',
      body: 'prefixes only; tok_visa attach on company 938'
    },
    old: {
      label: 'OLD · local',
      url: 'local .env',
      status: 200,
      body: 'STRIPE_SECRET=sk_test_… · STRIPE_USA_SECRET=sk_test_…',
      ok: true,
      note: 'No STRIPE_KEY/pk_* in local .env (only STRIPE_SECRET + STRIPE_USA_SECRET).'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com/v2/admin/company/credit-card/stripe',
      status: 200,
      body: 'Credit card added successfully (tok_visa → last4 4242, cus_…)',
      ok: true,
      note: 'tok_visa only works with test secrets — staging5 STRIPE_SECRET is test mode.'
    },
    time: '2026-10-29 11:47 MST',
    verdict: 'Pass — sk_test_ local + staging5 tok_visa. No local pk_*; FE publishable not in this .env.'
  },
  {
    id: 'P4',
    section: 'pre',
    name: 'VoPay sandbox URL',
    status: 'skip',
    linear: 'P4 · VOPAY_API_URL is sandbox',
    simple: 'Confirm VoPay URL is sandbox. If not confirmed, skip every Pay workers item later.',
    sent: null,
    old: {
      label: 'OLD · local',
      url: '—',
      status: null,
      body: 'Not checked — Pay/VoPay access not granted.',
      ok: null,
      note: 'Skip Pay workers.'
    },
    new: {
      label: 'NEW · staging5',
      url: '—',
      status: null,
      body: 'Not checked — no VoPay access yet.',
      ok: null,
      note: 'Skip every Pay workers item; draft/export/mark-paid/cancel still OK.'
    },
    time: '2026-10-29 11:49 MST',
    verdict: 'Skipped — no VoPay access yet (Waz).'
  },
  {
    id: 'P5',
    section: 'pre',
    name: 'Queue workers running',
    status: 'pass',
    linear: 'P5 · faber-queue-l13 workers running',
    simple: 'Confirm staging5 queue workers (faber-queue-l13 and named -l13 queues) are up after last deploy.',
    sent: { method: 'Forge UI', url: 'Processes → Background processes', body: 'Screenshot from Waz' },
    old: {
      label: 'OLD · local',
      url: '—',
      status: null,
      body: 'N/A — local uses sync/queue not Forge daemons.',
      ok: true,
      note: 'Precondition is staging5-only.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'Forge Processes',
      status: 200,
      body: 'faber-queue-staging5-worker — Running (1 process)',
      ok: true,
      note: 'Matches staging5 queue worker daemon.'
    },
    time: '2026-10-29 11:51 MST',
    verdict: 'Pass — staging5 queue worker running in Forge.'
  },
  {
    id: 'P6',
    section: 'pre',
    name: 'HubSpot sandbox / blank',
    status: 'pass',
    linear: 'P6 · HUBSPOT_ACCESS_TOKEN sandbox or blank',
    simple: 'Confirm HubSpot token is sandbox or blank before creating companies/projects.',
    sent: {
      method: 'GET',
      url: 'https://api.hubapi.com/account-info/v3/details',
      body: 'Authorization: Bearer HUBSPOT_ACCESS_TOKEN (prefix only in report)'
    },
    old: {
      label: 'OLD · local',
      url: 'DB configurations + N/A for staging token',
      status: null,
      body: 'Shared DB use_hubspot_sync=1 (same staging DB).',
      ok: true,
      note: 'Flag is shared; token check is staging5 Forge env.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'HubSpot account-info + Forge env',
      status: 200,
      body: 'HUBSPOT_ACCESS_TOKEN → accountType DEVELOPER_TEST, portalId 343607524. use_hubspot_sync=1.',
      ok: true,
      note: 'Sandbox. HUBSPOT_ACCESS_TOKEN_STANDARD is STANDARD portal 343386062 — note only.'
    },
    time: '2026-10-29 11:52 MST',
    verdict: 'Pass — primary token is DEVELOPER_TEST sandbox; sync flag on.'
  },
  {
    id: 'P7',
    section: 'pre',
    name: 'wkhtmltopdf OpenSSL 3',
    status: 'pass',
    linear: 'P7 · wkhtmltopdf jammy / OpenSSL 3',
    simple: 'SSH check: wkhtmltopdf --version is the OpenSSL 3 jammy build.',
    sent: { method: 'Forge Commands', url: 'staging5', body: 'wkhtmltopdf --version; which; WKHTMLTOPDF_BINARY' },
    old: {
      label: 'OLD · local',
      url: '—',
      status: null,
      body: 'N/A — precondition is staging5 server binary.',
      ok: true,
      note: 'PDF parity later compares API outputs.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'Forge Commands',
      status: 200,
      body: 'wkhtmltopdf 0.12.6.1 (with patched qt)\n/usr/local/bin/wkhtmltopdf\nWKHTMLTOPDF_BINARY=unset',
      ok: true,
      note: 'Installed at expected path; env var unset is fine.'
    },
    time: '2026-10-29 12:00 MST',
    verdict: 'Pass — wkhtmltopdf present on staging5.'
  },
  {
    id: 'J1-01',
    section: 'jwt',
    name: 'Admin login + GET /user',
    status: 'pass',
    linear: '§1 · POST /auth/admin → token; GET /user returns admin',
    simple: 'Log in as admin on both servers, then call GET /user with the Bearer token. Expect 200 + token, and the user must be role Admin.',
    sent: {
      method: 'POST then GET',
      path: '/auth/admin → /user',
      body: '{ email, password } then Authorization: Bearer <token>',
      note: 'Passwords redacted. JWT redacted in bodies.'
    },
    old: {
      label: 'OLD · local :8001',
      url: 'http://127.0.0.1:8001/auth/admin + /user',
      status: 200,
      body: 'auth: { "token": "<JWT>" }\nuser: id 2, email waz+faber-admin@mail.grokbot.com, user_role Admin (id 3)',
      ok: true,
      note: 'Local admin account on faber_local.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com/auth/admin + /user',
      status: 200,
      body: 'auth: { "token": "<JWT>" }\nuser: id 163, email jordan+1@faberconnect.com, user_role Admin (id 3)',
      ok: true,
      note: 'Staging admin; role matches Linear expectation.'
    },
    time: '2026-10-29 12:01 MST',
    verdict: 'Pass — both sides return 200 token and Admin user on GET /user.'
  },
  {
    id: 'J1-02',
    section: 'jwt',
    name: 'Contractor + worker login',
    status: 'pass',
    linear: '§1 · POST /auth/contractor + /auth/worker → token; GET /user right role',
    simple: 'Register/confirm a customer and a worker on each side, log in on the matching app route, then GET /user. Expect 200 token and the matching role (Contractor / Worker).',
    sent: {
      method: 'POST then GET',
      path: '/auth/contractor + /auth/worker → /user',
      body: '{ email, password } then Authorization: Bearer <token>',
      note: 'Fresh confirmed accounts this pass. JWT redacted.'
    },
    old: {
      label: 'OLD · local :8001',
      url: 'http://127.0.0.1:8001',
      status: 200,
      body: 'contractor: token + user id 2368 role Contractor (1)\nworker: token + user id 2369 role Worker (2)',
      ok: true,
      note: 'Both logins 200; roles correct.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com',
      status: 200,
      body: 'contractor: token + user id 2377 role Contractor (1)\nworker: token + user id 2378 role Worker (2)',
      ok: true,
      note: 'Both logins 200; roles correct.'
    },
    time: '2026-10-29 12:04 MST',
    verdict: 'Pass — contractor and worker login + GET /user roles match on OLD and NEW.'
  },
  {
    id: 'J1-03',
    section: 'jwt',
    name: 'Wrong-app login rejected',
    status: 'pass',
    linear: '§1 · wrong app → clean 4xx, not 500',
    simple: 'Log a customer into /auth/worker and a worker into /auth/contractor. Expect a clean 4xx with a message, never a 500.',
    sent: {
      method: 'POST',
      path: '/auth/worker (customer) + /auth/contractor (worker)',
      body: '{ email, password } for the wrong app',
      note: 'Same confirmed accounts as J1-02.'
    },
    old: {
      label: 'OLD · local :8001',
      url: 'http://127.0.0.1:8001',
      status: 400,
      body: 'customer→worker: "You have a contractor account. Please use the Faber Contractor app instead."\nworker→contractor: "You have a worker account. Please use the Faber Worker app instead."',
      ok: true,
      note: 'Clean 400, no 500.'
    },
    new: {
      label: 'NEW · staging5',
      url: 'https://staging5.faberconnect.com',
      status: 400,
      body: 'customer→worker: "You have a contractor account. Please use the Faber Contractor app instead."\nworker→contractor: "You have a worker account. Please use the Faber Worker app instead."',
      ok: true,
      note: 'Identical messages to OLD.'
    },
    time: '2026-10-29 12:05 MST',
    verdict: 'Pass — both sides return 400 with the expected wrong-app messages.'
  }
];

const STATUS = {
  pass: { cls: 'ok', badge: 'pass', label: 'Pass' },
  fail: { cls: 'fail', badge: 'fail', label: 'Fail' },
  wait: { cls: 'wait', badge: 'wait', label: 'Waiting' },
  todo: { cls: 'todo', badge: 'todo', label: 'Not started' },
  skip: { cls: 'skip', badge: 'skip', label: 'Skipped' }
};

function esc(t){return String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function sideHtml(s){
  if(!s) return `<div class="side"><h4>Not run</h4><p class="meta">No request yet.</p></div>`;
  return `<div class="side">
    <h4>${esc(s.label)}</h4>
    <div class="code ${s.ok?'ok':'bad'}">${esc(s.status)}</div>
    <div class="meta" style="margin-top:4px">${esc(s.url)}</div>
    <div class="label" style="margin-top:12px">Body</div>
    <pre>${esc(s.body)}</pre>
    ${s.note?`<p class="meta">${esc(s.note)}</p>`:''}
  </div>`;
}

function openM(id){
  const t=TESTS.find(x=>x.id===id); if(!t) return;
  const st=STATUS[t.status];
  const sentPath = t.sent ? (t.sent.path || t.sent.url || '') : '';
  const sentBody = t.sent && t.sent.body != null
    ? (typeof t.sent.body === 'string' ? t.sent.body : JSON.stringify(t.sent.body,null,2))
    : '(no body)';
  const sent = t.sent
    ? `<div class="req"><div class="label">What we sent</div>
        <pre>${esc(t.sent.method)} ${esc(sentPath)}\n${esc(sentBody)}${t.sent.note?'\n\n'+esc(t.sent.note):''}</pre></div>`
    : `<div class="req"><div class="label">What we sent</div><p class="meta">Nothing sent yet.</p></div>`;
  document.getElementById('mbox').innerHTML=`
    <button class="close" onclick="closeM()">×</button>
    <span class="badge ${st.badge}">${st.label}</span>
    <h3>${esc(t.id)} · ${esc(t.name)}</h3>
    <div class="meta">${esc(t.linear)}</div>
    <p class="desc">${esc(t.simple)}</p>
    ${sent}
    <div class="label">What came back</div>
    <div class="sides">${sideHtml(t.old)}${sideHtml(t.new)}</div>
    <p><strong>${esc(t.verdict)}</strong></p>
    ${t.time?`<p class="meta">Checked: ${esc(t.time)}</p>`:''}
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
  location.hash=id;
}
function closeM(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
  if(location.hash) history.replaceState(null,'',location.pathname);
}

function render(){
  const passed=TESTS.filter(t=>t.status==='pass').length;
  const failed=TESTS.filter(t=>t.status==='fail').length;
  const skipped=TESTS.filter(t=>t.status==='skip').length;
  const waiting=TESTS.filter(t=>t.status==='wait').length;
  const next=TESTS.find(t=>t.status==='todo'||t.status==='wait');
  const nextLabel=next?`${next.id} (${next.name})`:'next Linear box';
  document.getElementById('banner').innerHTML=
    `<strong>In progress.</strong> ${passed} passed · ${failed} failed · ${skipped} skipped · ${waiting} waiting. Next: ${esc(nextLabel)}. Click any row for details.`;

  function rowsFor(sec){
    const list=TESTS.filter(t=>t.section===sec);
    if(!list.length) return `<p class="sec-empty">Not started.</p>`;
    const rows=list.map(t=>{
      const st=STATUS[t.status];
      const evid = t.status==='pass'
        ? `NEW ${t.new.status} · OLD ${t.old.status} · click for detail`
        : (t.status==='skip'?'Skipped':(t.status==='wait'?'Needs Forge':'—'));
      return `<tr class="click" onclick="openM('${t.id}')">
      <td class="${st.cls}">${st.label}</td>
      <td><strong>${esc(t.id)}</strong> · ${esc(t.name)}<div class="hint">${esc(t.linear)}</div></td>
      <td class="meta">${esc(evid)}</td>
    </tr>`;
    }).join('');
    return `<p class="hint">Click a row to open the popup.</p>
    <table><thead><tr><th style="width:110px">Status</th><th>Test</th><th>Evidence</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  }

  document.getElementById('app').innerHTML=`
    <div class="banner" id="banner"></div>
    <table class="sum"><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>
      <tr><td class="ok">Pass</td><td>${passed}</td></tr>
      <tr><td class="fail">Fail</td><td>${failed}</td></tr>
      <tr><td class="skip">Skipped</td><td>${skipped}</td></tr>
      <tr><td class="wait">Waiting</td><td>${waiting}</td></tr>
      <tr><td class="todo">Not started</td><td>${TESTS.filter(t=>t.status==='todo').length}</td></tr>
    </tbody></table>
    <h2>Preconditions</h2>
    ${rowsFor('pre')}
    <h2>§1 JWT</h2>
    ${rowsFor('jwt')}
    <h2>§2 OTP / v2 auth</h2>
    ${rowsFor('otp')}
    <h2>§3 Stripe</h2>
    ${rowsFor('stripe')}
    <h2>§4 Hours</h2>
    ${rowsFor('hours')}
    <h2>§5 Worker pay</h2>
    ${rowsFor('pay')}
    <h2>§6 Invoices / PDFs</h2>
    ${rowsFor('invoice')}
    <h2>§7 Regression</h2>
    ${rowsFor('reg')}
  `;
  // re-set banner after innerHTML wiped it
  document.getElementById('banner').innerHTML=
    `<strong>In progress.</strong> ${passed} passed · ${failed} failed · ${skipped} skipped · ${waiting} waiting. Next: unconfirmed account 403. Click any row for details.`;
  const h=location.hash.slice(1); if(h) openM(h);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
</html>

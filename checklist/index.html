.modal.open{display:flex}.box{background:#fff;border-radius:14px;max-width:1100px;width:100%;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.box h3{font-size:22px;margin:8px 0 4px}.close{float:right;border:0;background:var(--soft);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.desc{font-size:16px;margin:12px 0 20px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:640px){.sides{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--soft)}
.side h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.side .code{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.side .code.ok{color:var(--grn)}.side .code.bad{color:var(--red)}
.side pre,.req pre{background:#1c1917;color:#e7e5e4;padding:12px;border-radius:8px;font-size:13px;overflow:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.req{margin:16px 0}.label{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.badge.pass{color:var(--grn);background:var(--grnbg)}.badge.fail{color:var(--red);background:var(--redbg)}.badge.wait{color:var(--amb);background:var(--ambbg)}.badge.todo{color:var(--mute);background:var(--soft)}.badge.skip{color:#57534e;background:#f5f5f4}
.sec-empty{color:var(--mute);padding:8px 0}
a{color:#1d4ed8}
.warn{color:#a16207;font-weight:600}.badge.warn{color:#a16207;background:#fef9c3}
tr.child td{background:#fcfcfb;font-size:15px}tr.child td.tname{padding-left:44px}
.call{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.call h4{margin:0 0 6px;font-size:17px}.mono{font-family:ui-monospace,Menlo,monospace}
.side pre,.req pre{max-height:520px}
.diffs{background:#fef9c3;border-radius:8px;padding:10px 14px;margin:10px 0}

const STATUS={pass:{cls:'ok',badge:'pass',label:'Pass'},warn:{cls:'warn',badge:'warn',label:'Pass · shape ⚠'},fail:{cls:'fail',badge:'fail',label:'Fail'},wait:{cls:'wait',badge:'wait',label:'Waiting'},todo:{cls:'todo',badge:'todo',label:'Not started'},skip:{cls:'skip',badge:'skip',label:'Skipped'}};
function esc(t){return String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function hdrs(h){const k=Object.keys(h||{});return k.length?k.map(x=>x+': '+h[x]).join('\n'):'(none of interest)'}
function find(id){for(const t of TESTS){if(t.id===id)return {t};for(const c of (t.children||[]))if(c.id===id)return {t:c,parent:t,n:t.children.indexOf(c)+1}}}

let DIFFS_ONLY=false;
function parseDiffs(d){return (d||[]).map(x=>{let m=x.match(/^(\S+?):\s*(.+ vs .+)$/);let path,kind,side=null;
 if(m){path=m[1];kind='type'}else if(m=x.match(/^(\S+) only on (NEW|OLD)$/)){path=m[1];kind='missing';side=m[2]==='NEW'?'old':'new'}
 else if(m=x.match(/^(\S+) missing on (NEW|OLD)$/)){path=m[1];kind='missing';side=m[2].toLowerCase()}else return {text:x,kind:'type',path:null};
 if(path==='root')path='';return {text:x,path,kind,missingOn:side}})}
function bodyHtml(body,diffs,which){let j;try{j=JSON.parse(body)}catch(e){const d=diffs.find(x=>x.path==='');return d?`<span class="diff-${d.kind==='type'?'type':'miss'}">${esc(body)}</span>`:esc(body)}
 const map={};const ph={};diffs.forEach(d=>{if(d.path===null)return;if(d.kind==='missing'&&d.missingOn===which){const i=Math.max(d.path.lastIndexOf('.'),d.path.lastIndexOf('['));const par=d.path.slice(0,i);const k=d.path.slice(i).replace(/^\./,'');(ph[par]=ph[par]||[]).push(k)}else map[d.path]=d.kind});
 const keys=Object.keys(map).concat(Object.keys(ph));const rel=p=>keys.some(k=>k===p||k.startsWith(p+'.')||k.startsWith(p+'['))||p==='';
 const wrap=(p,h)=>map[p]?`<span class="${map[p]==='type'?'diff-type':'diff-miss'}">${h}</span>`:h;
 function r(v,p,ind){const pad='  '.repeat(ind+1),end='  '.repeat(ind);
  if(v&&typeof v==='object'){const arr=Array.isArray(v);const ents=arr?v.map((x,i)=>[i,x]):Object.entries(v);let lines=[],skipped=0;
   ents.forEach(([k,x])=>{const cp=arr?`${p}[${k}]`:`${p}.${k}`;if(DIFFS_ONLY&&!map[cp]&&!rel(cp)){skipped++;return}
    const lab=arr?'':`"${esc(k)}": `;lines.push(pad+wrap(cp,lab+(map[cp]?esc(JSON.stringify(x,null,2)).replace(/\n/g,'\n'+pad):r(x,cp,ind+1))))});
   (ph[p]||[]).forEach(k=>lines.push(pad+`<span class="diff-miss">"${esc(k)}": «missing»</span>`));
   if(skipped)lines.push(pad+`<span class="jfold">… ${skipped} unchanged</span>`);
   if(!lines.length)return arr?'[]':'{}';return (arr?'[':'{')+'\n'+lines.join(',\n')+'\n'+end+(arr?']':'}')}
  return esc(JSON.stringify(v))}
 return wrap('',r(j,'',0))}
function toggleDiffs(id){DIFFS_ONLY=!DIFFS_ONLY;openM(id)}
function sideHtml(s,diffs,which){return `<div class="side"><h4>${esc(s.label)}</h4>
 <div class="code ${s.status<400?'ok':'bad'}">${esc(s.status)}</div>
 <div class="meta mono" style="margin-top:4px">${esc(s.url)}</div>
 <div class="label" style="margin-top:12px">Response headers</div><pre>${esc(hdrs(s.headers))}</pre>
 <div class="label" style="margin-top:12px">Response body (${DIFFS_ONLY?'diffs only':'full'})</div><pre>${bodyHtml(s.body,diffs||[],which)}</pre>
 <p class="meta">Captured ${esc(s.at)}</p></div>`}
function sentHtml(c){const r=s=>`${esc(c.method)} ${esc(s.url)}\n${esc(hdrs(s.reqHeaders))}\n\n${esc(s.reqBody??'(no body)')}`;
 return `<div class="req"><div class="label">What we sent</div><div class="sides"><div><div class="meta">OLD</div><pre>${r(c.old)}</pre></div><div><div class="meta">NEW</div><pre>${r(c.new)}</pre></div></div></div>`}
function callHtml(c,n,parent){const st=STATUS[c.status];
 return `<span class="badge ${st.badge}">${st.label}</span>
 <h3>${esc(c.id)} · Call ${n} · <span class="mono">${esc(c.method)} ${esc(c.path)}</span></h3>
 <div class="meta">Part of ${esc(parent.id)} · ${esc(parent.name)} — ${esc(parent.linear)}</div>
 ${sentHtml(c)}
 <div class="label">What came back${c.diffs.length?`<button class="dtoggle" onclick="toggleDiffs('${c.id}')">${DIFFS_ONLY?'Show full JSON':'Show diffs only'}</button>`:''}</div><div class="sides">${sideHtml(c.old,parseDiffs(c.diffs),'old')}${sideHtml(c.new,parseDiffs(c.diffs),'new')}</div>
 ${c.diffs.length?`<div class="diffs"><strong>Shape differences (OLD vs NEW)</strong><pre style="background:none;color:inherit;padding:0">${parseDiffs(c.diffs).map(d=>`<span class="${d.kind==='type'?'diff-type':'diff-miss'}">${esc(d.text)}</span>`).join('\n')}</pre></div>`:''}
 ${c.note?`<p class="meta">${esc(c.note)}</p>`:''}
 <p><strong>Verdict: ${esc(c.verdict)}</strong></p>`}
function openM(id){const f=find(id);if(!f)return;const t=f.t;let h='';
 if(f.parent) h=callHtml(t,f.n,f.parent);
 else if(t.children){const st=STATUS[t.status];
  h=`<span class="badge ${st.badge}">${st.label}</span><h3>${esc(t.id)} · ${esc(t.name)}</h3><div class="meta">${esc(t.linear)}</div><p class="desc">${esc(t.simple)}</p>
  <table><thead><tr><th>Call</th><th>Request</th><th>OLD</th><th>NEW</th><th>Result</th></tr></thead><tbody>${t.children.map((c,i)=>`<tr class="click" onclick="openM('${c.id}')"><td>${i+1} · ${esc(c.id)}</td><td class="mono">${esc(c.method)} ${esc(c.path)}<div class="hint">${esc(c.name)}</div></td><td>${c.old.status}</td><td>${c.new.status}</td><td class="${STATUS[c.status].cls}">${STATUS[c.status].label}</td></tr>`).join('')}</tbody></table>
  <p class="hint">Click a call for its full report.</p><p><strong>${esc(t.verdict)}</strong></p>`}
 else {const st=STATUS[t.status];
  h=`<span class="badge ${st.badge}">${st.label}</span><h3>${esc(t.id)} · ${esc(t.name)}</h3><div class="meta">${esc(t.linear)}</div>
  <div class="req"><div class="label">What we did</div><pre>${esc(t.sent)}</pre></div>
  <div class="sides"><div class="side"><h4>OLD</h4><pre>${esc(t.oldS)}</pre></div><div class="side"><h4>NEW</h4><pre>${esc(t.newS)}</pre></div></div>
  <p><strong>${esc(t.verdict)}</strong></p><p class="meta">Checked ${esc(t.time)}</p>`}
 document.getElementById('mbox').innerHTML=`<button class="close" onclick="closeM()">×</button>`+h;
 document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';location.hash=id;window.scrollTo(0,0);document.getElementById('modal').scrollTop=0}
function closeM(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';if(location.hash)history.replaceState(null,'',location.pathname)}
function render(){const c=s=>TESTS.filter(t=>t.status===s).length;const calls=TESTS.reduce((a,t)=>a+(t.children||[]).length,0);
 document.getElementById('banner').innerHTML=`<strong>In progress.</strong> ${c('pass')} pass · ${c('warn')} pass with shape ⚠ · ${c('fail')} fail · ${c('skip')} skipped · ${c('wait')} waiting. ${calls} API calls, each with its own report. Click a test for its call list, or an indented call row for the full OLD/NEW report.`;
 function rows(sec){const l=TESTS.filter(t=>t.section===sec);if(!l.length)return `<p class="sec-empty">Not started.</p>`;
  return `<table><thead><tr><th style="width:140px">Status</th><th>Test / API call</th><th style="width:170px">OLD → NEW</th></tr></thead><tbody>${l.map(t=>{const st=STATUS[t.status];
   let r=`<tr class="click" onclick="openM('${t.id}')"><td class="${st.cls}">${st.label}</td><td><strong>${esc(t.id)}</strong> · ${esc(t.name)}<div class="hint">${esc(t.linear)}</div></td><td class="meta">${t.children?t.children.length+' call'+(t.children.length>1?'s':''):'no API call'}</td></tr>`;
   for(const ch of (t.children||[])){const s2=STATUS[ch.status];r+=`<tr class="click child" onclick="openM('${ch.id}')"><td class="${s2.cls}">↳ ${s2.label}</td><td class="tname"><strong>${esc(ch.id)}</strong> · <span class="mono">${esc(ch.method)} ${esc(ch.path)}</span><div class="hint">${esc(ch.name)}</div></td><td class="meta">${ch.old.status} → ${ch.new.status}</td></tr>`}
   return r}).join('')}</tbody></table>`}
 document.getElementById('main').innerHTML=`<h2>Preconditions</h2>${rows('pre')}<h2>§1 JWT</h2>${rows('jwt')}`+['§2 OTP / v2 auth','§3 Stripe','§4 Hours','§5 Worker pay','§6 Invoices / PDFs','§7 Regression'].map(x=>`<h2>${x}</h2><p class="sec-empty">Not started.</p>`).join('');
